version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Frameworks are intentionally pinned; adm-zip version is locked for zip-bomb security.
    # Major version bumps are deliberate, per-framework tasks managed as explicit PRs.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "sequelize"
        update-types:
          - version-update:semver-major
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "date-fns"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "adm-zip"
