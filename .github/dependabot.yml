version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Frameworks are intentionally pinned; adm-zip version is locked for zip-bomb security.
    # Major version bumps are deliberate, per-framework tasks managed as explicit PRs.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "sequelize"
        update-types:
          - version-update:semver-major
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "date-fns"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "adm-zip"
      # reflect-metadata 0.2 conflicts with @nestjs/* 8 peer ranges; bump with the Nest upgrade.
      - dependency-name: "reflect-metadata"
      # passport 0.7 is outside @nestjs/passport 8's peer range (^0.4-^0.6);
      # Dependabot counts 0.x steps as minor. Bump with the Nest upgrade.
      - dependency-name: "passport"
      # No ESLint configuration is in use here; plugin majors are noise.
      - dependency-name: "eslint-plugin-unicorn"
      # @types/express must track the Express major that @nestjs/platform-express 8 brings (4).
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
